<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> PRAVEEN GUDENKATTI | </title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&amp;family=Outfit:wght@300;400;500;600;700;800&amp;family=Dancing+Script:wght@600;700&amp;display=swap" rel="stylesheet">
<style>

/* ============ DREAMY PREMIUM THEME ============ */
:root{
  --bg:#0b0616;
  --bg-2:#140a24;
  --surface:rgba(255,255,255,0.045);
  --surface-2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);
  --border-glow:rgba(186,104,255,0.5);
  --primary:#c084fc;
  --primary-2:#f472b6;
  --primary-3:#fb7185;
  --accent:#fbbf24;
  --cyan:#22d3ee;
  --text:#fdf9ff;
  --text-2:#b8b0d4;
  --text-3:#7a7291;
  --grad-1:linear-gradient(135deg,#c084fc 0%,#f472b6 50%,#fb7185 100%);
  --grad-2:linear-gradient(135deg,#a78bfa 0%,#ec4899 100%);
  --grad-3:linear-gradient(135deg,#22d3ee 0%,#a78bfa 50%,#f472b6 100%);
  --grad-soft:linear-gradient(135deg,#f0abfc 0%,#fbcfe8 100%);
  --ease:cubic-bezier(0.16,1,0.3,1);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
  position:relative;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* Dreamy animated background */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 15% 10%,rgba(192,132,252,0.3),transparent 55%),
    radial-gradient(ellipse 70% 55% at 85% 25%,rgba(244,114,182,0.25),transparent 55%),
    radial-gradient(ellipse 90% 70% at 50% 95%,rgba(34,211,238,0.18),transparent 55%),
    radial-gradient(ellipse 60% 50% at 30% 60%,rgba(251,113,133,0.15),transparent 55%);
  z-index:-2;
  animation:auroraShift 25s ease-in-out infinite alternate;
  pointer-events:none;
}
@keyframes auroraShift{
  0%{transform:scale(1) translate(0,0) rotate(0deg);}
  50%{transform:scale(1.18) translate(-3%,2%) rotate(2deg);}
  100%{transform:scale(1.08) translate(3%,-2%) rotate(-2deg);}
}

/* Soft noise */
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
  opacity:0.035;
  z-index:-1;
  pointer-events:none;
  mix-blend-mode:overlay;
}

/* Floating sparkles layer */
.sparkles-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}
.spark{
  position:absolute;
  color:white;
  opacity:0.6;
  animation:sparkFloat linear infinite;
  text-shadow:0 0 10px rgba(192,132,252,0.9),0 0 20px rgba(244,114,182,0.6);
  font-size:10px;
  user-select:none;
}
@keyframes sparkFloat{
  0%{transform:translateY(100vh) scale(0.5) rotate(0deg);opacity:0;}
  10%{opacity:0.8;}
  90%{opacity:0.8;}
  100%{transform:translateY(-100px) scale(1) rotate(360deg);opacity:0;}
}

/* Custom scrollbar */
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:var(--bg-2);}
::-webkit-scrollbar-thumb{
  background:var(--grad-2);
  border-radius:10px;
  border:2px solid var(--bg-2);
}
::-webkit-scrollbar-thumb:hover{background:var(--grad-1);}

::selection{background:rgba(192,132,252,0.4);color:var(--text);}

/* ============ PRELOADER ============ */
#preloader{
  position:fixed;inset:0;
  background:radial-gradient(circle at center,#140a24,#0b0616);
  z-index:9999;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1s var(--ease),visibility 1s var(--ease);
}
#preloader.hidden{opacity:0;visibility:hidden;}

.preloader-inner{
  text-align:center;
  display:flex;flex-direction:column;
  align-items:center;gap:34px;
}

.preloader-avatar-wrap{
  position:relative;
  width:150px;height:150px;
}
.preloader-avatar-wrap::before{
  content:'';
  position:absolute;
  inset:-14px;
  border-radius:50%;
  background:conic-gradient(from 0deg,var(--primary),var(--primary-2),var(--cyan),var(--primary));
  animation:spin 2.5s linear infinite;
  filter:blur(8px);
  opacity:0.7;
}
.preloader-avatar-wrap::after{
  content:'';
  position:absolute;
  inset:-22px;
  border-radius:50%;
  border:1px dashed rgba(192,132,252,0.4);
  animation:spin 8s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg);}}

.preloader-avatar{
  position:relative;
  width:100%;height:100%;
  border-radius:50%;
  background-image:url('https://tinyurl.com/22x4drcy');
  background-size:cover;
  background-position:center;
  border:4px solid var(--bg);
  box-shadow:0 0 50px rgba(192,132,252,0.6);
  animation:avatarBreath 2.5s ease-in-out infinite;
  z-index:2;
}
@keyframes avatarBreath{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.06);}
}

.preloader-text{
  font-family:'Sora',sans-serif;
  font-size:0.72rem;
  font-weight:600;
  letter-spacing:9px;
  text-transform:uppercase;
  color:var(--text-2);
  padding-left:9px;
  animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink{50%{opacity:0.4;}}

.preloader-bar{
  width:220px;height:2px;
  background:rgba(255,255,255,0.08);
  border-radius:2px;
  overflow:hidden;
}
.preloader-bar-fill{
  height:100%;width:0%;
  background:var(--grad-3);
  box-shadow:0 0 15px var(--primary);
  transition:width 0.3s ease;
}

/* ============ HEADER ============ */
header{
  position:fixed;top:0;left:0;right:0;
  z-index:1000;
  padding:16px 0;
  transition:all 0.5s var(--ease);
}
header.scrolled{
  padding:10px 0;
  background:rgba(11,6,22,0.75);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border);
}

.container{max-width:1240px;margin:0 auto;padding:0 32px;}

.nav-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}

.nav-logo{
  display:flex;align-items:center;gap:12px;
  text-decoration:none;
  font-family:'Sora',sans-serif;
  font-weight:800;font-size:1.1rem;
  letter-spacing:-0.5px;
  color:var(--text);
  transition:transform 0.3s var(--ease);
}
.nav-logo:hover{transform:scale(1.03);}

.logo-mark{
  width:42px;height:42px;
  border-radius:13px;
  background:var(--grad-2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;
  color:white;
  box-shadow:0 8px 24px rgba(192,132,252,0.45);
  position:relative;
  overflow:hidden;
}
.logo-mark::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.5) 50%,transparent 60%);
  transform:translateX(-100%);
  transition:transform 0.9s ease;
}
.nav-logo:hover .logo-mark::after{transform:translateX(100%);}

.logo-text{display:flex;flex-direction:column;line-height:1.05;}
.logo-text .name{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-size:1.15rem;
}
.logo-text .sub{
  font-size:0.6rem;
  font-weight:500;
  letter-spacing:2.5px;
  color:var(--text-3);
  text-transform:uppercase;
}

.nav-menu{
  display:flex;align-items:center;gap:4px;
  padding:5px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:100px;
  backdrop-filter:blur(20px);
}
.nav-menu a{
  padding:9px 20px;
  border-radius:100px;
  text-decoration:none;
  color:var(--text-2);
  font-size:0.88rem;
  font-weight:500;
  transition:all 0.3s var(--ease);
}
.nav-menu a:hover{color:var(--text);}
.nav-menu a.active{
  color:var(--bg);
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 6px 20px rgba(192,132,252,0.4);
}

.nav-cta{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 22px;
  border-radius:100px;
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  text-decoration:none;
  font-size:0.88rem;font-weight:600;
  transition:all 0.4s var(--ease);
}
.nav-cta:hover{
  background:var(--grad-2);
  border-color:transparent;
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(244,114,182,0.45);
}
.nav-cta i{font-size:0.8rem;}

.menu-toggle{display:none;}

/* ============ HERO ============ */
.hero{
  position:relative;
  padding:160px 0 100px;
  min-height:100vh;
  display:flex;align-items:center;
  overflow:hidden;
}

.hero-inner{
  display:grid;
  grid-template-columns:1.1fr 1fr;
  gap:70px;
  align-items:center;
  position:relative;
  z-index:2;
}

.hero-left{
  opacity:0;transform:translateY(40px);
  animation:heroIn 1.2s var(--ease) 0.7s forwards;
}
@keyframes heroIn{to{opacity:1;transform:translateY(0);}}

.hero-pill{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 20px 8px 8px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:100px;
  font-size:0.82rem;
  font-weight:500;
  color:var(--text-2);
  margin-bottom:28px;
  backdrop-filter:blur(10px);
  transition:all 0.3s var(--ease);
}
.hero-pill:hover{
  border-color:var(--border-glow);
  transform:translateY(-2px);
}
.hero-pill .dot{
  width:34px;height:34px;
  border-radius:50%;
  background:var(--grad-2);
  display:flex;align-items:center;justify-content:center;
  color:white;
  font-size:0.9rem;
  box-shadow:0 4px 12px rgba(192,132,252,0.5);
}
.hero-pill .dot::after{
  content:'';
  width:9px;height:9px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 12px #22c55e;
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.5;transform:scale(1.35);}
}
.hero-pill span{padding-right:12px;}

.hero-title{
  font-family:'Sora',sans-serif;
  font-size:clamp(2.4rem,5.2vw,4rem);
  font-weight:800;
  line-height:1.08;
  letter-spacing:-0.03em;
  margin-bottom:24px;
  color:var(--text);
}
.hero-title .script{
  display:block;
  font-family:'Dancing Script',cursive;
  font-size:0.58em;
  font-weight:600;
  letter-spacing:0;
  color:var(--text-2);
  margin-bottom:8px;
}
.hero-title .grad{
  background:var(--grad-1);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  position:relative;
  display:inline-block;
  background-size:200% 200%;
  animation:gradShift 5s ease infinite;
}
@keyframes gradShift{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}

.hero-desc{
  font-size:1.02rem;
  color:var(--text-2);
  max-width:520px;
  margin-bottom:36px;
  line-height:1.8;
}
.hero-desc b{color:var(--text);font-weight:600;}

.hero-actions{
  display:flex;align-items:center;gap:16px;
  flex-wrap:wrap;margin-bottom:46px;
}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 28px;
  border-radius:100px;
  font-family:'Outfit',sans-serif;
  font-size:0.95rem;font-weight:600;
  text-decoration:none;cursor:pointer;
  border:none;
  transition:all 0.4s var(--ease);
  position:relative;overflow:hidden;
}
.btn-primary{
  background:var(--grad-2);
  color:white;
  box-shadow:0 12px 32px rgba(192,132,252,0.45),0 0 0 1px rgba(255,255,255,0.1) inset;
}
.btn-primary::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
  transform:translateX(-100%);
  transition:transform 0.7s ease;
}
.btn-primary:hover::before{transform:translateX(100%);}
.btn-primary:hover{
  transform:translateY(-3px);
  box-shadow:0 20px 45px rgba(192,132,252,0.65),0 0 0 1px rgba(255,255,255,0.2) inset;
}
.btn-ghost{
  background:rgba(255,255,255,0.05);
  color:var(--text);
  border:1px solid var(--border);
  backdrop-filter:blur(10px);
}
.btn-ghost:hover{
  background:rgba(255,255,255,0.1);
  border-color:var(--border-glow);
  transform:translateY(-3px);
}
.btn i{font-size:0.85rem;}

.hero-stats{
  display:flex;gap:38px;
  padding-top:30px;
  border-top:1px solid var(--border);
}
.stat-item h4{
  font-family:'Sora',sans-serif;
  font-size:1.55rem;font-weight:700;
  background:var(--grad-2);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:2px;
}
.stat-item p{
  font-size:0.74rem;
  color:var(--text-3);
  letter-spacing:1.6px;
  text-transform:uppercase;
  font-weight:500;
}

/* Right side - Profile */
.hero-right{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(0.92);
  animation:heroIn 1.2s var(--ease) 0.9s forwards;
}

.profile-stage{
  position:relative;
  width:460px;
  height:460px;
  transition:transform 0.3s var(--ease);
}

/* Soft aura glow behind profile */
.profile-aura{
  position:absolute;
  inset:-80px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(192,132,252,0.35),rgba(244,114,182,0.15) 40%,transparent 70%);
  filter:blur(60px);
  z-index:-1;
  animation:auraPulse 5s ease-in-out infinite;
}
@keyframes auraPulse{
  0%,100%{opacity:0.7;transform:scale(1);}
  50%{opacity:1;transform:scale(1.12);}
}

/* Orbit rings */
.orbit-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.08);
  animation:orbitSpin 28s linear infinite;
}
.orbit-ring.ring-2{
  inset:-35px;
  border-style:dashed;
  border-color:rgba(192,132,252,0.18);
  animation-duration:42s;
  animation-direction:reverse;
}
.orbit-ring.ring-3{
  inset:-70px;
  border-color:rgba(244,114,182,0.12);
  animation-duration:65s;
}
@keyframes orbitSpin{to{transform:rotate(360deg);}}

.orbit-dot{
  position:absolute;
  width:12px;height:12px;
  border-radius:50%;
  background:var(--primary);
  box-shadow:0 0 20px var(--primary),0 0 40px var(--primary);
  top:-6px;left:50%;
  transform:translateX(-50%);
}
.orbit-dot::after{
  content:'';
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:1px solid var(--primary);
  opacity:0.4;
  animation:dotRing 2s ease-out infinite;
}
@keyframes dotRing{
  0%{transform:scale(1);opacity:0.6;}
  100%{transform:scale(2);opacity:0;}
}
.ring-2 .orbit-dot{
  background:var(--primary-2);
  box-shadow:0 0 20px var(--primary-2),0 0 40px var(--primary-2);
  width:9px;height:9px;
}
.ring-2 .orbit-dot::after{border-color:var(--primary-2);}
.ring-3 .orbit-dot{
  background:var(--cyan);
  box-shadow:0 0 20px var(--cyan),0 0 40px var(--cyan);
  width:7px;height:7px;
}
.ring-3 .orbit-dot::after{border-color:var(--cyan);}

/* Main profile picture — BADA & CLEAR */
.profile-photo-wrap{
  position:absolute;
  inset:30px;
  border-radius:50%;
  padding:5px;
  background:conic-gradient(from 0deg,var(--primary),var(--primary-2),var(--cyan),var(--primary));
  box-shadow:
    0 0 90px rgba(192,132,252,0.55),
    0 40px 80px -20px rgba(0,0,0,0.85),
    0 0 0 1px rgba(255,255,255,0.12) inset;
  animation:photoRotate 22s linear infinite,photoPulse 5s ease-in-out infinite;
}
@keyframes photoRotate{to{filter:hue-rotate(360deg);}}
@keyframes photoPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.015);}
}

.profile-photo-inner{
  width:100%;height:100%;
  border-radius:50%;
  overflow:hidden;
  position:relative;
  background:var(--bg-2);
  border:5px solid var(--bg);
  display:flex;align-items:center;justify-content:center;
}
.profile-photo-inner img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center top;
  border-radius:50%;
  transition:transform 0.9s var(--ease);
  filter:brightness(1.08) saturate(1.12) contrast(1.05);
  image-rendering:-webkit-optimize-contrast;
}
.profile-photo-inner:hover img{transform:scale(1.06);}

.profile-photo-inner::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 45%,rgba(255,255,255,0.22) 50%,transparent 55%);
  transform:translateX(-100%);
  animation:shineSlide 4.5s ease-in-out infinite;
  pointer-events:none;
  border-radius:50%;
}
@keyframes shineSlide{
  0%,65%{transform:translateX(-100%);}
  100%{transform:translateX(100%);}
}

/* Floating badges */
.float-badge{
  position:absolute;
  padding:11px 18px;
  background:rgba(20,12,35,0.9);
  border:1px solid var(--border);
  border-radius:100px;
  backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:8px;
  font-size:0.78rem;
  font-weight:600;
  color:var(--text);
  white-space:nowrap;
  box-shadow:0 20px 45px rgba(0,0,0,0.55);
  animation:badgeFloat 6s ease-in-out infinite;
  z-index:5;
}
.float-badge i{
  font-size:0.9rem;
  background:var(--grad-2);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.float-badge.b1{top:6%;left:-14%;animation-delay:0s;}
.float-badge.b2{bottom:14%;right:-18%;animation-delay:2s;}
.float-badge.b3{bottom:-2%;left:14%;animation-delay:4s;}
@keyframes badgeFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-14px);}
}

/* Crown badge on top of photo */
.crown-badge{
  position:absolute;
  top:-8px;left:50%;
  transform:translateX(-50%);
  width:56px;height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  display:flex;align-items:center;justify-content:center;
  color:white;
  font-size:1.4rem;
  box-shadow:0 8px 25px rgba(251,191,36,0.6),0 0 0 5px var(--bg);
  z-index:6;
  animation:crownBob 3s ease-in-out infinite;
}
@keyframes crownBob{
  0%,100%{transform:translateX(-50%) translateY(0) rotate(-5deg);}
  50%{transform:translateX(-50%) translateY(-6px) rotate(5deg);}
}

/* Team badge below profile */
.team-badge{
  position:absolute;
  bottom:-70px;left:50%;
  transform:translateX(-50%);
  padding:12px 26px;
  background:rgba(20,12,35,0.9);
  border:1.5px solid rgba(192,132,252,0.4);
  border-radius:100px;
  backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:10px;
  font-family:'Sora',sans-serif;
  font-size:0.82rem;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text);
  white-space:nowrap;
  box-shadow:0 20px 45px rgba(0,0,0,0.55),0 0 40px rgba(192,132,252,0.25);
  animation:teamFloat 3.5s ease-in-out infinite;
  z-index:6;
}
.team-badge i{
  color:var(--primary-2);
  font-size:0.95rem;
}
.team-badge .team-text{
  background:var(--grad-1);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@keyframes teamFloat{
  0%,100%{transform:translateX(-50%) translateY(0);}
  50%{transform:translateX(-50%) translateY(-8px);}
}

/* ============ SECTION HEAD ============ */
section{padding:120px 0;position:relative;}

.section-head{
  text-align:center;margin-bottom:80px;
  max-width:700px;
  margin-left:auto;margin-right:auto;
}

.section-tag{
  display:inline-flex;align-items:center;gap:10px;
  padding:7px 18px;
  background:rgba(192,132,252,0.08);
  border:1px solid rgba(192,132,252,0.25);
  border-radius:100px;
  font-family:'Sora',sans-serif;
  font-size:0.7rem;font-weight:600;
  letter-spacing:2.5px;
  text-transform:uppercase;
  color:var(--primary);
  margin-bottom:20px;
}
.section-tag::before{
  content:'';
  width:6px;height:6px;
  border-radius:50%;
  background:var(--primary);
  box-shadow:0 0 10px var(--primary);
  animation:pulseDot 2s ease-in-out infinite;
}

.section-title{
  font-family:'Sora',sans-serif;
  font-size:clamp(1.9rem,4.2vw,2.8rem);
  font-weight:800;
  line-height:1.18;
  letter-spacing:-0.03em;
  color:var(--text);
  margin-bottom:16px;
}
.section-title .grad{
  background:var(--grad-1);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.section-desc{
  font-size:0.98rem;
  color:var(--text-2);
  line-height:1.7;
}

/* ============ ABOUT ============ */
.about-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:28px;
  align-items:stretch;
}

.about-main{
  padding:44px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:28px;
  backdrop-filter:blur(20px);
  position:relative;
  overflow:hidden;
  transition:all 0.5s var(--ease);
}
